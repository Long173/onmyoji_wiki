name: onmyoji_wiki
description: "Wiki tiếng Việt cho game Onmyoji — Thức Thần, Ngự hồn, danh sách yêu thích."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_screenutil: ^5.9.3
  diacritic: ^0.1.6

  # Server backend (Supabase) + local cache + network images
  supabase_flutter: ^2.8.0
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  http: ^1.2.2
  infinite_scroll_pagination: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  # Data + images đều phục vụ từ Supabase Storage — không bundle nữa.
  # File `.env` chứa SUPABASE_URL + SUPABASE_ANON_KEY (xem `.env.example`).
  assets:
    - .env

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
